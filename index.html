<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Traductor LSCh - IA Entrenada</title>
  
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Traductor LSCh - IA Multimodal</h1>
  </header>

  <div id="view-translator" class="view active">
    <div class="viewport">
      <video id="webcam" playsinline></video>
      <canvas id="output_canvas"></canvas>
    </div>

    <div class="status-card">
      <div class="letter-detected" id="statusText">Escribe el nombre de la seña y presiona Grabar</div>
    </div>

    <div class="speller-box" id="spellerText"></div>

    <div class="controls" style="margin-top: 15px;">
      <input type="text" id="labelInput" placeholder="Nombre de la seña (ej: hola)" style="padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; width: 60%;">
      <button class="btn" id="btnRecord" style="background-color: #dc3545; color: white; margin-top: 5px;">🔴 Grabar Seña (10s)</button>
    </div>

    <div class="controls" style="margin-top: 15px;">
      <button class="btn" onclick="trainDirectly()" style="background-color: #ffc107; color: #000; font-weight: bold; width: 90%; padding: 12px;">⚡ ENTRENAR IA CON SEÑAS GRABADAS</button>
    </div>

    <div class="controls" style="margin-top: 15px;">
      <button class="btn btn-audio" id="btnSpeak">🔊 Audio</button>
      <button class="btn btn-clear" id="btnClear">Borrar Texto</button>
    </div>

    <!-- Botones para guardar y cargar modelo -->
    <div class="controls" style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
      <button class="btn" id="btnSaveModel" style="background-color: #2196F3; color: white; width: 45%;">💾 Guardar Modelo</button>
      <input type="file" id="loadModelInput" multiple style="display: none;" accept=".json,.bin">
      <button class="btn" id="btnLoadModel" style="background-color: #9C27B0; color: white; width: 45%;">📁 Cargar Modelo</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
