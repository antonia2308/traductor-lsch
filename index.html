<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Traductor LSCh - IA Entrenada</title>
  
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <!-- TensorFlow.js para la Red Neuronal -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Traductor LSCh - IA Multimodal</h1>
  </header>

  <div id="view-translator" class="view active">
    <div class="viewport">
      <video id="webcam" playsinline></video>
      <canvas id="output_canvas"></canvas>
    </div>

    <div class="status-card">
      <div class="letter-detected" id="statusText">Carga tu archivo JSON para entrenar</div>
      <small id="subStatus">Haz clic en "Cargar Datos y Entrenar IA"</small>
    </div>

    <div class="speller-box" id="spellerText"></div>

    <div class="trainer-box">
     <input type="file" id="jsonInput" accept=".json,.txt" style="display: none;" onchange="loadAndTrain(event)" />
      <button class="btn btn-audio" onclick="document.getElementById('jsonInput').click()">📂 Cargar Datos y Entrenar IA</button>
    </div>

    <div class="controls" style="margin-top: 10px;">
      <input type="text" id="labelInput" placeholder="Nombre de la seña (ej: hola)" style="padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; margin-right: 5px;">
      <button class="btn" id="btnRecord" style="background-color: #28a745; color: white;">🔴 Grabar Seña (10s)</button>
      <button class="btn" id="btnCopyData">📋 Copiar Datos Grabados</button>
    </div>

    <div class="controls" style="margin-top: 10px;">
      <button class="btn btn-audio" id="btnSpeak">🔊 Audio</button>
      <button class="btn btn-clear" id="btnClear">Borrar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
